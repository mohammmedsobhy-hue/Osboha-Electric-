<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Energy Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Outer Circuit Rings & Nodes -->
  <circle cx="16" cy="16" r="2.5" fill="#38bdf8" />
  <circle cx="48" cy="16" r="2.5" fill="#f59e0b" />
  <circle cx="16" cy="48" r="2.5" fill="#0284c7" />
  <circle cx="48" cy="48" r="2.5" fill="#38bdf8" />
  <path d="M16 16 L24 16 M40 16 L48 16 M16 48 L24 48 M40 48 L48 48" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- High-Voltage Lightning Bolt -->
  <path
    d="M34 8 L18 34 L31 34 L27 56 L46 28 L33 28 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />
  <path
    d="M34 8 L18 34 L31 34 L27 56 L46 28 L33 28 Z"
    stroke="#ffffff"
    stroke-width="1"
    stroke-linejoin="round"
    stroke-opacity="0.8"
  />
</svg>
